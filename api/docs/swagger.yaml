basePath: /
definitions:
  auth.Permission:
    enum:
    - users:manage
    - sources:manage
    - providers:manage
    - settings:manage
    - jobs:view_system
    type: string
    x-enum-varnames:
    - PermUsersManage
    - PermSourcesManage
    - PermProvidersManage
    - PermSettingsManage
    - PermJobsViewSystem
  dtos.AcceptInviteRequest:
    properties:
      email:
        maxLength: 254
        type: string
      name:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        type: string
      token:
        maxLength: 128
        type: string
    required:
    - email
    - name
    - password
    - token
    type: object
  dtos.AccountRequest:
    properties:
      email:
        maxLength: 254
        type: string
      name:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        type: string
    required:
    - email
    - name
    - password
    type: object
  dtos.ChangePasswordRequest:
    properties:
      current_password:
        maxLength: 72
        type: string
      new_password:
        maxLength: 72
        type: string
    required:
    - current_password
    - new_password
    type: object
  dtos.ChatModelListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/dtos.ChatModelResponse'
        type: array
    type: object
  dtos.ChatModelResponse:
    properties:
      display_name:
        type: string
      id:
        type: string
      local:
        type: boolean
      name:
        type: string
      own:
        description: Own is true when the caller's own provider (BYOK) serves the
          model.
        type: boolean
      provider_name:
        type: string
    type: object
  dtos.CitationResponse:
    properties:
      author:
        type: string
      comments:
        type: integer
      excerpt:
        description: Excerpt is a short plain-text preview of the item ("" when it
          has none).
        type: string
      item_id:
        type: string
      metrics:
        type: object
      published_at:
        type: string
      ref:
        type: integer
      score:
        type: integer
      source_kind:
        type: string
      source_name:
        type: string
      title:
        type: string
      url:
        type: string
    type: object
  dtos.ConnectionTestEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.ConnectionTestResponse'
    type: object
  dtos.ConnectionTestResponse:
    properties:
      error:
        type: string
      models:
        items:
          type: string
        type: array
      ok:
        type: boolean
    type: object
  dtos.CreateInviteRequest:
    properties:
      email:
        example: ana@example.com
        maxLength: 254
        type: string
      role:
        allOf:
        - $ref: '#/definitions/models.Role'
        enum:
        - admin
        - member
    required:
    - role
    type: object
  dtos.CreateModelRequest:
    properties:
      capability:
        allOf:
        - $ref: '#/definitions/models.ModelCapability'
        enum:
        - chat
        - embedding
      display_name:
        maxLength: 100
        type: string
      name:
        maxLength: 200
        type: string
    required:
    - capability
    - name
    type: object
  dtos.CreateOwnModelRequest:
    properties:
      display_name:
        maxLength: 100
        type: string
      name:
        maxLength: 200
        type: string
    required:
    - name
    type: object
  dtos.CreateOwnProviderRequest:
    properties:
      api_key:
        maxLength: 500
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/models.ProviderKind'
        enum:
        - openai
        - anthropic
        - gemini
    required:
    - api_key
    - kind
    type: object
  dtos.CreateProviderRequest:
    properties:
      api_key:
        maxLength: 500
        type: string
      base_url:
        maxLength: 500
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/models.ProviderKind'
        enum:
        - openai_compatible
        - openai
        - anthropic
        - gemini
      name:
        maxLength: 60
        type: string
    required:
    - kind
    - name
    type: object
  dtos.CreateReportRequest:
    properties:
      focus:
        example: fintech no Brasil
        maxLength: 200
        type: string
      window_hours:
        example: 24
        maximum: 720
        minimum: 1
        type: integer
    required:
    - window_hours
    type: object
  dtos.CreateSourceRequest:
    properties:
      config:
        type: object
      enabled:
        type: boolean
      interval_minutes:
        example: 30
        maximum: 1440
        minimum: 5
        type: integer
      kind:
        enum:
        - hackernews
        - tabnews
        - reddit
        - youtube
        - rss
        - lobsters
        - devto
        - mastodon
        - bluesky
        - github
        - producthunt
        example: rss
        type: string
      name:
        example: BBC Technology
        maxLength: 120
        type: string
      secret:
        description: |-
          Secret is the credential of kinds that take one (API token, app password).
          It is encrypted at rest and never returned.
        maxLength: 4096
        type: string
    required:
    - config
    - kind
    - name
    type: object
  dtos.DeepenIdeaRequest:
    properties:
      aspects:
        items:
          enum:
          - architecture
          - mvp_plan
          - market
          - monetization
          - audience
          - competitors
          type: string
        maxItems: 6
        type: array
      instruction:
        maxLength: 500
        type: string
    type: object
  dtos.EditIdeaRequest:
    properties:
      content:
        $ref: '#/definitions/dtos.IdeaContentDTO'
      difficulty:
        allOf:
        - $ref: '#/definitions/models.Difficulty'
        enum:
        - beginner
        - intermediate
        - advanced
      effort_weeks:
        maximum: 104
        minimum: 1
        type: integer
      summary:
        maxLength: 1000
        type: string
      title:
        maxLength: 120
        type: string
    required:
    - content
    - difficulty
    - effort_weeks
    - summary
    - title
    type: object
  dtos.ErrorBody:
    properties:
      code:
        example: VALIDATION_FAILED
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        example: invalid request
        type: string
    type: object
  dtos.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/dtos.ErrorBody'
    type: object
  dtos.EvidenceResponse:
    properties:
      comments:
        type: integer
      excerpt:
        description: Excerpt is a short plain-text preview of the item ("" when it
          has none).
        type: string
      item_id:
        type: string
      published_at:
        type: string
      ref:
        example: E1
        type: string
      score:
        type: integer
      source_kind:
        type: string
      source_name:
        type: string
      title:
        type: string
      url:
        type: string
    type: object
  dtos.GenerateIdeasRequest:
    properties:
      count:
        example: 3
        maximum: 5
        minimum: 1
        type: integer
      focus:
        example: ferramentas para devs
        maxLength: 200
        type: string
      item_ids:
        description: |-
          ItemIDs starts from news items the caller picked: they are cited first, then
          the window and focus fill the rest. Not allowed with report_id.
        example:
        - 5f0c1f8e-3c8a-4c1e-9a43-2b7e0f1d6c11
        items:
          type: string
        maxItems: 5
        type: array
      report_id:
        description: |-
          ReportID starts from one of the caller's finished reports: its cited items
          first, then its window and focus (focus and window_days are ignored).
        example: 5f0c1f8e-3c8a-4c1e-9a43-2b7e0f1d6c11
        type: string
      window_days:
        example: 7
        maximum: 30
        minimum: 1
        type: integer
    required:
    - count
    type: object
  dtos.HealthEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.HealthStatus'
    type: object
  dtos.HealthStatus:
    properties:
      status:
        example: ok
        type: string
    type: object
  dtos.IdeaContentDTO:
    properties:
      architecture_steps:
        items:
          type: string
        maxItems: 20
        type: array
      audience:
        items:
          $ref: '#/definitions/models.AudienceSegment'
        maxItems: 8
        minItems: 1
        type: array
      competitors:
        items:
          $ref: '#/definitions/models.Competitor'
        maxItems: 12
        type: array
      differentiator:
        maxLength: 4000
        type: string
      how:
        maxLength: 8000
        type: string
      monetization:
        maxLength: 4000
        type: string
      mvp_plan:
        items:
          $ref: '#/definitions/models.PlanStep'
        maxItems: 12
        minItems: 2
        type: array
      stack:
        items:
          type: string
        maxItems: 20
        type: array
      why_now:
        maxLength: 8000
        type: string
    required:
    - audience
    - how
    - mvp_plan
    - why_now
    type: object
  dtos.IdeaEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.IdeaResponse'
    type: object
  dtos.IdeaListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/dtos.IdeaListItemResponse'
        type: array
      meta:
        $ref: '#/definitions/dtos.PageMeta'
    type: object
  dtos.IdeaListItemResponse:
    properties:
      created_at:
        type: string
      current_version:
        type: integer
      difficulty:
        allOf:
        - $ref: '#/definitions/models.Difficulty'
        enum:
        - beginner
        - intermediate
        - advanced
      effort_weeks:
        type: integer
      evidence_count:
        type: integer
      id:
        type: string
      last_origin:
        allOf:
        - $ref: '#/definitions/models.VersionOrigin'
        enum:
        - generated
        - merged
        - deepened
        - manual
      merged_candidates:
        type: integer
      primary_audience:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.IdeaStatus'
        enum:
        - new
        - saved
        - discarded
      summary:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  dtos.IdeaResponse:
    properties:
      created_at:
        type: string
      current:
        $ref: '#/definitions/dtos.IdeaVersionResponse'
      current_version:
        type: integer
      id:
        type: string
      merged_candidates:
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/models.IdeaStatus'
        enum:
        - new
        - saved
        - discarded
      updated_at:
        type: string
      versions:
        items:
          $ref: '#/definitions/dtos.IdeaVersionSummaryResponse'
        type: array
    type: object
  dtos.IdeaStatusRequest:
    properties:
      status:
        allOf:
        - $ref: '#/definitions/models.IdeaStatus'
        enum:
        - new
        - saved
        - discarded
    required:
    - status
    type: object
  dtos.IdeaVersionEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.IdeaVersionResponse'
    type: object
  dtos.IdeaVersionResponse:
    properties:
      change_note:
        type: string
      content:
        $ref: '#/definitions/models.IdeaContent'
      created_at:
        type: string
      difficulty:
        allOf:
        - $ref: '#/definitions/models.Difficulty'
        enum:
        - beginner
        - intermediate
        - advanced
      effort_weeks:
        type: integer
      evidence:
        items:
          $ref: '#/definitions/dtos.EvidenceResponse'
        type: array
      model_name:
        type: string
      origin:
        allOf:
        - $ref: '#/definitions/models.VersionOrigin'
        enum:
        - generated
        - merged
        - deepened
        - manual
      similarity:
        type: number
      summary:
        type: string
      title:
        type: string
      version:
        type: integer
    type: object
  dtos.IdeaVersionSummaryResponse:
    properties:
      change_note:
        type: string
      created_at:
        type: string
      model_name:
        type: string
      origin:
        allOf:
        - $ref: '#/definitions/models.VersionOrigin'
        enum:
        - generated
        - merged
        - deepened
        - manual
      similarity:
        type: number
      version:
        type: integer
    type: object
  dtos.InviteInfoEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.InviteInfoResponse'
    type: object
  dtos.InviteInfoResponse:
    properties:
      email:
        type: string
      expires_at:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/models.Role'
        enum:
        - admin
        - member
    type: object
  dtos.InviteLinkEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.InviteLinkResponse'
    type: object
  dtos.InviteLinkResponse:
    properties:
      email:
        type: string
      emailed:
        type: boolean
      expires_at:
        type: string
      id:
        type: string
      url:
        example: https://newsp.example.com/invite/k3Jx9...
        type: string
    type: object
  dtos.InviteListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/dtos.InviteResponse'
        type: array
      meta:
        $ref: '#/definitions/dtos.PageMeta'
    type: object
  dtos.InviteResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      expires_at:
        type: string
      id:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/models.Role'
        enum:
        - admin
        - member
    type: object
  dtos.ItemListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/dtos.ItemResponse'
        type: array
      meta:
        $ref: '#/definitions/dtos.PageMeta'
    type: object
  dtos.ItemResponse:
    properties:
      author:
        type: string
      cited:
        description: Cited is true when a report or an idea cites the item.
        type: boolean
      collected_at:
        type: string
      comments:
        type: integer
      id:
        type: string
      metrics:
        type: object
      published_at:
        type: string
      score:
        type: integer
      source:
        $ref: '#/definitions/dtos.ItemSourceResponse'
      summary:
        type: string
      title:
        type: string
      url:
        type: string
    type: object
  dtos.ItemSourceResponse:
    properties:
      id:
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/models.SourceKind'
        enum:
        - hackernews
        - tabnews
        - reddit
        - youtube
        - rss
        - lobsters
        - devto
        - mastodon
        - bluesky
        - github
        - producthunt
      name:
        type: string
    type: object
  dtos.JobAccepted:
    properties:
      job_id:
        type: string
    type: object
  dtos.JobAcceptedEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.JobAccepted'
    type: object
  dtos.JobEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.JobResponse'
    type: object
  dtos.JobResponse:
    properties:
      attempts:
        type: integer
      created_at:
        type: string
      error:
        type: string
      finished_at:
        type: string
      id:
        type: string
      kind:
        example: report.generate
        type: string
      max_attempts:
        type: integer
      result:
        type: object
      run_at:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.JobStatus'
        enum:
        - pending
        - running
        - done
        - failed
        - canceled
    type: object
  dtos.LinkEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.LinkResponse'
    type: object
  dtos.LinkResponse:
    properties:
      expires_at:
        type: string
      id:
        type: string
      url:
        example: https://newsp.example.com/invite/k3Jx9...
        type: string
    type: object
  dtos.LoginRequest:
    properties:
      email:
        maxLength: 254
        type: string
      password:
        maxLength: 72
        type: string
    required:
    - email
    - password
    type: object
  dtos.ModelEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.ModelResponse'
    type: object
  dtos.ModelResponse:
    properties:
      capability:
        allOf:
        - $ref: '#/definitions/models.ModelCapability'
        enum:
        - chat
        - embedding
      display_name:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      name:
        example: qwen3:14b
        type: string
      provider_id:
        type: string
      tokens_last_7d:
        type: integer
    type: object
  dtos.OwnProvidersEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.OwnProvidersResponse'
    type: object
  dtos.OwnProvidersResponse:
    properties:
      byok_enabled:
        type: boolean
      providers:
        items:
          $ref: '#/definitions/dtos.ProviderResponse'
        type: array
    type: object
  dtos.PageMeta:
    properties:
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 42
        type: integer
    type: object
  dtos.PasswordResetRequest:
    properties:
      email:
        maxLength: 254
        type: string
    required:
    - email
    type: object
  dtos.PreferencesEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.PreferencesResponse'
    type: object
  dtos.PreferencesRequest:
    properties:
      excluded_source_ids:
        items:
          type: string
        maxItems: 500
        type: array
      idea_model_id:
        type: string
      ideas_per_day:
        maximum: 10
        minimum: 0
        type: integer
      output_lang:
        enum:
        - pt-BR
        - en
        type: string
      report_enabled:
        type: boolean
      report_model_id:
        type: string
      report_time:
        example: "08:00"
        type: string
      theme:
        enum:
        - light
        - dark
        - system
        type: string
      timezone:
        example: America/Sao_Paulo
        maxLength: 64
        type: string
      topics:
        items:
          type: string
        maxItems: 20
        type: array
      ui_locale:
        enum:
        - pt-BR
        - en
        type: string
    required:
    - output_lang
    - report_time
    - theme
    - timezone
    - ui_locale
    type: object
  dtos.PreferencesResponse:
    properties:
      excluded_source_ids:
        items:
          type: string
        type: array
      idea_model_id:
        type: string
      ideas_per_day:
        type: integer
      next_report_at:
        type: string
      output_lang:
        enum:
        - pt-BR
        - en
        type: string
      report_enabled:
        type: boolean
      report_model_id:
        type: string
      report_time:
        type: string
      theme:
        enum:
        - light
        - dark
        - system
        type: string
      timezone:
        type: string
      topics:
        items:
          type: string
        type: array
      topics_ranked:
        description: |-
          TopicsRanked is false when no embedding model is configured: reports then
          rank items by recency and engagement only.
        type: boolean
      ui_locale:
        enum:
        - pt-BR
        - en
        type: string
    type: object
  dtos.ProviderEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.ProviderResponse'
    type: object
  dtos.ProviderListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/dtos.ProviderResponse'
        type: array
    type: object
  dtos.ProviderResponse:
    properties:
      base_url:
        type: string
      enabled:
        type: boolean
      has_api_key:
        type: boolean
      id:
        type: string
      key_hint:
        example: ••••a9Fk
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/models.ProviderKind'
        enum:
        - openai_compatible
        - openai
        - anthropic
        - gemini
      last_check_at:
        type: string
      last_error:
        type: string
      models:
        items:
          $ref: '#/definitions/dtos.ModelResponse'
        type: array
      name:
        type: string
    type: object
  dtos.RefreshRequest:
    properties:
      refresh_token:
        maxLength: 128
        type: string
    required:
    - refresh_token
    type: object
  dtos.ReportCreatedEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.ReportCreatedResponse'
    type: object
  dtos.ReportCreatedResponse:
    properties:
      job_id:
        type: string
      report:
        $ref: '#/definitions/dtos.ReportSummaryResponse'
    type: object
  dtos.ReportEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.ReportResponse'
    type: object
  dtos.ReportListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/dtos.ReportSummaryResponse'
        type: array
      meta:
        $ref: '#/definitions/dtos.PageMeta'
    type: object
  dtos.ReportResponse:
    properties:
      citations:
        items:
          $ref: '#/definitions/dtos.CitationResponse'
        type: array
      completed_at:
        type: string
      content_md:
        type: string
      created_at:
        type: string
      error:
        description: |-
          Error is a stable code (NO_ITEMS, REPORT_MODEL_NOT_SET, AI_REFUSED,
          AI_INVALID_OUTPUT, AI_KEY_REJECTED, AI_FAILURE) for failed reports.
        type: string
      focus:
        type: string
      id:
        type: string
      items_considered:
        type: integer
      kind:
        allOf:
        - $ref: '#/definitions/models.ReportKind'
        enum:
        - scheduled
        - manual
      model_name:
        type: string
      output_lang:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.ReportStatus'
        enum:
        - pending
        - running
        - done
        - failed
      summary:
        type: string
      title:
        type: string
      window_end:
        type: string
      window_start:
        type: string
    type: object
  dtos.ReportSummaryResponse:
    properties:
      completed_at:
        type: string
      created_at:
        type: string
      error:
        description: |-
          Error is a stable code (NO_ITEMS, REPORT_MODEL_NOT_SET, AI_REFUSED,
          AI_INVALID_OUTPUT, AI_KEY_REJECTED, AI_FAILURE) for failed reports.
        type: string
      focus:
        type: string
      id:
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/models.ReportKind'
        enum:
        - scheduled
        - manual
      status:
        allOf:
        - $ref: '#/definitions/models.ReportStatus'
        enum:
        - pending
        - running
        - done
        - failed
      summary:
        type: string
      title:
        type: string
      window_end:
        type: string
      window_start:
        type: string
    type: object
  dtos.ResetPasswordRequest:
    properties:
      password:
        maxLength: 72
        type: string
      token:
        maxLength: 128
        type: string
    required:
    - password
    - token
    type: object
  dtos.SessionEnvelope:
    properties:
      data:
