      reindex_job_id:
        type: string
      retention_days:
        type: integer
      signup_enabled:
        type: boolean
      updated_at:
        type: string
    type: object
  dtos.SetupStatusEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.SetupStatusResponse'
    type: object
  dtos.SetupStatusResponse:
    properties:
      password_reset_enabled:
        description: PasswordResetEnabled tells whether "forgot password" can e-mail
          a link.
        type: boolean
      setup_required:
        type: boolean
      signup_enabled:
        type: boolean
    type: object
  dtos.SignupRequest:
    properties:
      email:
        maxLength: 254
        type: string
      locale:
        description: Locale is the language of the account and its e-mails; pt-BR
          by default.
        enum:
        - pt-BR
        - en
        example: pt-BR
        type: string
      name:
        maxLength: 100
