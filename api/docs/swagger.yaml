        description: BYOKEnabled lets users connect their own AI providers (bring
          your own key).
        type: boolean
      default_idea_model_id:
        type: string
      default_report_model_id:
        type: string
      embedding_model_id:
        type: string
      idea_similarity_threshold:
        type: number
      inactivity_pause_days:
        description: |-
          InactivityPauseDays pauses reports and ideas of accounts not seen for
          this many days; 0 never pauses.
