info:
  contact: {}
  description: Collects market news and generates reports and project ideas.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
  title: newsp API
  version: 0.1.0
paths:
  /api/v1/admin/ai/models/{id}:
    delete:
      parameters:
      - description: Model ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a model
      tags:
      - admin-ai
    patch:
      consumes:
      - application/json
      parameters:
      - description: Model ID
        in: path
        name: id
        required: true
        type: string
      - description: Changes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateModelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ModelEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Rename, enable or disable a model
      tags:
      - admin-ai
  /api/v1/admin/ai/providers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ProviderListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List AI providers with their models
      tags:
      - admin-ai
    post:
      consumes:
      - application/json
      description: Use kind openai_compatible for Ollama, llama.cpp, LM Studio or
        vLLM (base_url required). The key is encrypted and never returned.
      parameters:
      - description: Provider
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateProviderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.ProviderEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register an AI provider
      tags:
      - admin-ai
  /api/v1/admin/ai/providers/{id}:
    delete:
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an AI provider and its models
      tags:
      - admin-ai
    patch:
      consumes:
      - application/json
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      - description: Changes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ProviderEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an AI provider
      tags:
      - admin-ai
  /api/v1/admin/ai/providers/{id}/models:
    post:
      consumes:
      - application/json
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      - description: Model
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateModelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.ModelEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register a model of a provider
      tags:
      - admin-ai
  /api/v1/admin/ai/providers/{id}/test:
    post:
      description: Lists the provider's models. A failed test is a 200 with ok=false
        and a readable error.
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ConnectionTestEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Test a provider connection
      tags:
      - admin-ai
  /api/v1/admin/invites:
    get:
      parameters:
      - description: Page size (max 100)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.InviteListEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List pending invites
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: The link is shown only once. With an e-mail, the invite is bound
        to that address and the link is also e-mailed (emailed = true); an address
        that already has an account returns 409 EMAIL_TAKEN, and an instance without
        e-mail delivery returns 422 MAILER_NOT_CONFIGURED.
      parameters:
      - description: Invite
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateInviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.InviteLinkEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an invite link
      tags:
      - admin
  /api/v1/admin/invites/{id}:
    delete:
      parameters:
      - description: Invite ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke a pending invite
      tags:
      - admin
  /api/v1/admin/settings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.SettingsEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Instance settings
      tags:
      - admin-settings
    patch:
      consumes:
      - application/json
      description: Changing the embedding model starts a reindex job; its id is returned
        as reindex_job_id. Turning signup_enabled on without e-mail delivery returns
        422 MAILER_NOT_CONFIGURED.
      parameters:
      - description: Changes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.SettingsEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update instance settings
      tags:
      - admin-settings
  /api/v1/admin/sources:
    get:
      description: Every source by name, with the number of items collected in the
        last 24 hours.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.SourceListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List sources with their collection status
      tags:
      - admin-sources
    post:
      consumes:
      - application/json
      description: The config depends on the kind and is validated and completed with
        defaults by its connector; invalid fields are reported as config.<field>.
        Kinds that take a credential (github, producthunt, bluesky search) receive
        it in secret, which is encrypted and never returned (see has_secret).
      parameters:
      - description: Source
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateSourceRequest'
