      summary: List my own AI providers with their models
      tags:
      - me-ai
    post:
      consumes:
      - application/json
      description: Only openai, anthropic and gemini, at their official URLs, one
        per kind. The key is encrypted and never returned. Returns 409 PROVIDER_KIND_TAKEN
        when the kind is already connected and 422 BYOK_DISABLED when an admin turned
        own keys off.
      parameters:
      - description: Provider
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateOwnProviderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.ProviderEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Connect my own AI provider
      tags:
      - me-ai
  /api/v1/me/ai/providers/{id}:
    delete:
      description: Works while own keys are turned off, so users can always take their
        key back out.
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete my own AI provider, its key and its models
      tags:
      - me-ai
    patch:
      consumes:
      - application/json
      description: 'The key can be replaced but not removed: delete the provider instead.
        Another user''s or an instance provider answers 404.'
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      - description: Changes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateOwnProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ProviderEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Replace the key of, enable or disable my own AI provider
      tags:
      - me-ai
  /api/v1/me/ai/providers/{id}/models:
    post:
      consumes:
      - application/json
      description: Users' models are always chat models.
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      - description: Model
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateOwnModelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.ModelEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register a chat model of my own provider
      tags:
      - me-ai
  /api/v1/me/ai/providers/{id}/test:
    post:
      description: Lists the provider's models. A failed test is a 200 with ok=false
        and a readable error.
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ConnectionTestEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Test my own provider connection
      tags:
      - me-ai
  /api/v1/me/password:
    put:
      consumes:
      - application/json
      description: Ends every other session and returns a new session for this device.
      parameters:
      - description: Passwords
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.SessionEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change the current user's password
      tags:
      - me
  /api/v1/me/preferences:
    get:
      description: Returns defaults until the user saves preferences.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.PreferencesEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: My preferences
      tags:
      - me
    put:
      consumes:
      - application/json
      description: Topics are deduplicated; the next daily report is scheduled in
        the given time zone.
      parameters:
      - description: Preferences
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.PreferencesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.PreferencesEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Replace my preferences
      tags:
      - me
  /api/v1/me/verify-email/resend:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: E-mail a new verification link to the current user
      tags:
      - me
  /api/v1/password-resets/confirm:
    post:
      consumes:
      - application/json
      description: Ends every session of the user.
      parameters:
      - description: Reset
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.ResetPasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      summary: Set a new password through a reset link
      tags:
      - auth
  /api/v1/password-resets/inspect:
    post:
      consumes:
      - application/json
      parameters:
      - description: Reset token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.TokenRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      summary: Check a password reset link
      tags:
      - auth
  /api/v1/password-resets/request:
    post:
      consumes:
      - application/json
      description: Always answers 202 with no body, whether or not the e-mail belongs
        to an account; the link is sent only to active accounts, and the answer and
        its timing do not depend on that. Limited per e-mail and per client IP.
      parameters:
      - description: E-mail
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.PasswordResetRequest'
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      summary: Ask for a password reset link by e-mail
      tags:
      - auth
  /api/v1/reports:
    get:
      parameters:
      - description: scheduled or manual
        in: query
        name: kind
        type: string
      - description: Page size (max 100)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ReportListEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: My reports
      tags:
      - reports
    post:
      consumes:
      - application/json
      description: Queues a report over the last window_hours. Poll the job, or the
        report, until it is done. One report at a time per user.
      parameters:
      - description: Window and optional focus
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateReportRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/dtos.ReportCreatedEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Generate a report now
      tags:
      - reports
  /api/v1/reports/{id}:
    delete:
      description: Permanently removes a finished (done or failed) report and its
        citations; collected items are kept. Reports still being generated answer
        409 REPORT_IN_PROGRESS.
      parameters:
      - description: Report ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete one of my reports
      tags:
      - reports
    get:
      parameters:
      - description: Report ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ReportEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: One of my reports, with its citations
      tags:
      - reports
  /api/v1/setup:
    post:
      consumes:
      - application/json
      description: Works once per instance; afterwards it returns 409.
      parameters:
      - description: First admin
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.AccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.SessionEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      summary: Create the first admin
      tags:
      - auth
  /api/v1/setup/status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.SetupStatusEnvelope'
      summary: First-run setup status
      tags:
      - auth
  /api/v1/sources:
    get:
      description: Id, kind, name and enabled flag of every source, for feed filters.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.SourceSummaryListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List sources
      tags:
      - sources
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.HealthEnvelope'
      summary: Liveness probe
      tags:
      - health
  /readyz:
    get:
      description: Checks that the database answers.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.HealthEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      summary: Readiness probe
      tags:
      - health
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
