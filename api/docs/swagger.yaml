    type: object
  dtos.SourceListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/dtos.SourceResponse'
        type: array
    type: object
  dtos.SourceResponse:
    properties:
      config:
        type: object
      consecutive_failures:
        type: integer
      created_at:
        type: string
      enabled:
        type: boolean
      has_secret:
        type: boolean
      id:
        type: string
      interval_minutes:
        type: integer
      items_24h:
        type: integer
      kind:
        allOf:
        - $ref: '#/definitions/models.SourceKind'
        enum:
        - hackernews
        - tabnews
        - reddit
        - youtube
        - rss
        - lobsters
        - devto
        - mastodon
        - bluesky
        - github
        - producthunt
      last_error:
        type: string
      last_run_at:
        type: string
      last_success_at:
        type: string
      name:
        type: string
      next_run_at:
        type: string
    type: object
  dtos.SourceSummary:
    properties:
      enabled:
        type: boolean
      id:
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/models.SourceKind'
        enum:
        - hackernews
        - tabnews
        - reddit
        - youtube
        - rss
        - lobsters
        - devto
        - mastodon
        - bluesky
        - github
        - producthunt
      name:
        type: string
    type: object
  dtos.SourceSummaryListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/dtos.SourceSummary'
        type: array
    type: object
  dtos.TokenRequest:
    properties:
      token:
        maxLength: 128
        type: string
    required:
    - token
    type: object
  dtos.UpdateModelRequest:
    properties:
      display_name:
        maxLength: 100
        minLength: 1
        type: string
      enabled:
        type: boolean
    type: object
  dtos.UpdateOwnProviderRequest:
    properties:
      api_key:
        maxLength: 500
        minLength: 1
        type: string
      enabled:
        type: boolean
    type: object
  dtos.UpdateProviderRequest:
    properties:
      api_key:
        maxLength: 500
        type: string
      base_url:
        maxLength: 500
        type: string
      enabled:
        type: boolean
      name:
        maxLength: 60
        minLength: 1
        type: string
    type: object
  dtos.UpdateSettingsRequest:
    properties:
      byok_enabled:
        type: boolean
      default_idea_model_id:
        type: string
      default_report_model_id:
        type: string
      embedding_model_id:
        type: string
      idea_similarity_threshold:
        maximum: 0.99
        minimum: 0.5
        type: number
      inactivity_pause_days:
        maximum: 3650
        minimum: 0
        type: integer
      retention_days:
        maximum: 3650
        minimum: 7
        type: integer
      signup_enabled:
        type: boolean
    type: object
  dtos.UpdateSourceRequest:
    properties:
      config:
        type: object
      enabled:
        type: boolean
      interval_minutes:
        maximum: 1440
        minimum: 5
        type: integer
      name:
        maxLength: 120
        minLength: 1
        type: string
      secret:
        description: Secret replaces the credential; an empty string removes it.
        maxLength: 4096
        type: string
    type: object
  dtos.UpdateUserAccessRequest:
    properties:
      role:
        allOf:
        - $ref: '#/definitions/models.Role'
        enum:
        - admin
        - member
      status:
        allOf:
        - $ref: '#/definitions/models.UserStatus'
        enum:
        - active
        - disabled
    type: object
  dtos.UserEnvelope:
    properties:
      data:
        $ref: '#/definitions/dtos.UserResponse'
    type: object
  dtos.UserListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/dtos.UserResponse'
        type: array
      meta:
        $ref: '#/definitions/dtos.PageMeta'
    type: object
  dtos.UserResponse:
    properties:
      created_at:
        type: string
      email:
        example: ana@example.com
        type: string
      email_verified:
        type: boolean
      id:
        example: 6f1c1d0e-5a4b-4f1e-9b1c-2a3d4e5f6a7b
        type: string
      last_seen_at:
        type: string
      locale:
        example: pt-BR
        type: string
      name:
        example: Ana Costa
        type: string
      permissions:
        items:
          $ref: '#/definitions/auth.Permission'
        type: array
      role:
        allOf:
        - $ref: '#/definitions/models.Role'
        enum:
        - admin
        - member
        example: member
      status:
        allOf:
        - $ref: '#/definitions/models.UserStatus'
        enum:
        - active
        - disabled
        example: active
    type: object
  models.AudienceKind:
