version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
    - misspell
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - contextcheck
    - nilerr
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: receiver-naming
    gosec:
      excludes:
        - G104 # covered by errcheck
  exclusions:
    generated: lax
    paths:
      - docs
      - tests/mocks
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dev-fritz/newsp/api
