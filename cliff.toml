# git-cliff configuration: https://git-cliff.org/docs/configuration
# Generates CHANGELOG.md (Keep a Changelog style) from Conventional Commits 1.0.0.
#
#   git cliff --output CHANGELOG.md            # whole history
#   git cliff --unreleased --tag v0.2.0 --prepend CHANGELOG.md
#
# Never edit CHANGELOG.md by hand.

[changelog]
header = """
<!--
  Generated by git-cliff from Conventional Commits (see cliff.toml).
  Do not edit by hand: it is regenerated from the commit history.
-->

# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**BREAKING:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/dev-fritz/newsp/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
footer = """
{% for release in releases -%}
  {% if release.version -%}
    {% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/dev-fritz/newsp/compare/{{ release.previous.version }}...{{ release.version }}
    {% endif -%}
  {% else -%}
[Unreleased]: https://github.com/dev-fritz/newsp/compare/{{ release.previous.version }}...HEAD
  {% endif -%}
{% endfor %}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
topo_order = false

commit_preprocessors = [
  # Link issue and pull request references to GitHub.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/dev-fritz/newsp/pull/${1}))" },
]

commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { field = "author.name", pattern = "dependabot\\[bot\\]", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^revert", group = "<!-- 4 -->Reverted" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^test", group = "<!-- 7 -->Tests" },
  { message = "^(chore|style)", group = "<!-- 8 -->Miscellaneous" },
]
